name: Desktop client

on:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      # The desktop protocol is implemented by the backend as well. Keep this
      # workflow green when a handler, route, service, middleware or migration
      # changes without requiring a no-op desktop edit.
      - 'backend/**'
      - 'frontend/src/views/auth/DesktopDeviceApprovalView.vue'
      - 'Makefile'
      - 'docs/FORK_UPSTREAM_DIFF_CN.md'
      - '.github/workflows/desktop.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/src/views/auth/DesktopDeviceApprovalView.vue'
      - 'Makefile'
      - 'docs/FORK_UPSTREAM_DIFF_CN.md'
      - '.github/workflows/desktop.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

# The first phase intentionally publishes private Actions artifacts only.
# Signing/notarization is kept outside this workflow until the release owner
# supplies platform credentials and explicitly enables a release job.
jobs:
  desktop-go:
    name: Desktop Go tests
    # Ubuntu 22.04 still ships the WebKitGTK 4.0 development package used by
    # Wails v2's default Linux test build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: desktop/go.sum
      # Wails links the Linux test binary against GTK/WebKit even though Linux
      # is not a release target. Installing the headers keeps this contract
      # check representative of the native package.
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Test desktop Go module
        working-directory: desktop
        run: go test ./...
      - name: Vet desktop Go module
        working-directory: desktop
        run: go vet ./...

  backend-contract:
    name: Desktop backend contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Compile desktop contract packages
        working-directory: backend
        run: >-
          go test -tags=unit
          ./internal/handler
          ./internal/server/middleware
          ./internal/server/routes
          ./internal/service
          ./internal/repository
          ./migrations
          -run '^$'
      - name: Run desktop authorization, checkout and image history tests
        working-directory: backend
        run: >-
          go test -tags=unit -count=1
          ./internal/handler
          ./internal/server/middleware
          ./internal/server/routes
          ./internal/service
          ./internal/repository
          ./migrations
          -run 'Desktop|ClientCapabilities|CheckoutSession|AsyncImageHandlerUser|RequireDesktopScope|RequestURLForDPoP|RequireHTTPS|RefreshTokenCache|ImageTaskHistory'

  frontend:
    name: Desktop frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  windows-x64:
    name: Windows x64 Wails bundle
    needs: [frontend, desktop-go, backend-contract]
    # Windows 2022 includes the NSIS toolchain used by Wails. Pinning the
    # runner avoids silently moving to an image where `-nsis` only emits a
    # warning and leaves us with a bare executable.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Add Go tools to PATH
        shell: pwsh
        run: |
          (go env GOPATH) + '\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install and assert NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisPath 'makensis.exe'))) {
            throw "NSIS was not installed at $nsisPath"
          }
          # GITHUB_PATH is applied only to later steps. Update this process as
          # well so the assertion and the Wails invocation use the same tool.
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw 'makensis is not available on PATH'
          }
      - name: Build Windows client
        working-directory: desktop
        run: wails build -platform windows/amd64 -clean -nsis
      - name: Assert NSIS installer artifact
        working-directory: desktop
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path build/bin -Filter '*installer*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          if ($installers[0].Length -le 0) {
            throw "NSIS installer is empty: $($installers[0].FullName)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: magic-ai-assistant-windows-x64
          path: desktop/build/bin/*installer*.exe
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS Apple Silicon Wails bundle
    needs: [frontend, desktop-go, backend-contract]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build macOS arm64 client
        working-directory: desktop
        run: wails build -platform darwin/arm64 -clean
      - name: Package and verify DMG
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_path}" || ! -x "${app_path}/Contents/MacOS/神奇AI助手" ]]; then
            echo 'Wails did not produce a usable macOS app bundle' >&2
            exit 1
          fi
          dmg_path="build/bin/神奇AI助手.dmg"
          hdiutil create -volname '神奇AI助手' -srcfolder "${app_path}" -ov -format UDZO "${dmg_path}"
          hdiutil verify "${dmg_path}"
          test -s "${dmg_path}"
      - uses: actions/upload-artifact@v7
        with:
          name: magic-ai-assistant-macos-arm64
          path: desktop/build/bin/*.dmg
          if-no-files-found: error
          retention-days: 14
