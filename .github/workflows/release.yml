name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify_release_ref:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag_name: ${{ steps.verify.outputs.tag_name }}
      target_sha: ${{ steps.verify.outputs.target_sha }}
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag and required checks
        id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" --force
          git fetch origin "$DEFAULT_BRANCH"
          TARGET_SHA=$(tools/verify_release_tag.sh "$TAG_NAME" "origin/$DEFAULT_BRANCH")

          for workflow in backend-ci.yml security-scan.yml; do
            successful_runs=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$TARGET_SHA&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
            if [ "$successful_runs" -lt 1 ]; then
              echo "No successful $workflow run found for $TARGET_SHA" >&2
              exit 1
            fi
          done

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: [verify_release_ref]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify_release_ref.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [verify_release_ref, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.verify_release_ref.outputs.target_sha }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'

      # Docker setup for the bcol.cc linux/amd64 image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        env:
          TAG_NAME: ${{ needs.verify_release_ref.outputs.tag_name }}
          TARGET_SHA: ${{ needs.verify_release_ref.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" --force

          CHECKED_OUT_SHA=$(git rev-parse --verify HEAD)
          CURRENT_TAG_SHA=$(git rev-parse --verify "$TAG_NAME^{commit}")
          if [ "$CHECKED_OUT_SHA" != "$TARGET_SHA" ] || [ "$CURRENT_TAG_SHA" != "$TARGET_SHA" ]; then
            echo "Release ref changed after verification: checkout=$CHECKED_OUT_SHA tag=$CURRENT_TAG_SHA expected=$TARGET_SHA" >&2
            exit 1
          fi

      - name: Get tag message
        id: tag_message
        env:
          TAG_NAME: ${{ needs.verify_release_ref.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Processing tag: $TAG_NAME"

          # 获取完整的 tag message（跳过第一行标题）
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$TAG_NAME")

          # 调试输出
          echo "Tag message length: ${#TAG_MESSAGE}"
          echo "Tag message preview:"
          echo "$TAG_MESSAGE" | head -10

          delimiter="tag-message-$(openssl rand -hex 16)"
          {
            echo "message<<$delimiter"
            echo "$TAG_MESSAGE"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Verify remote tag is unchanged
        env:
          TAG_NAME: ${{ needs.verify_release_ref.outputs.tag_name }}
          TARGET_SHA: ${{ needs.verify_release_ref.outputs.target_sha }}
        run: |
          set -euo pipefail
          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$TAG_NAME^{}" | awk 'NR == 1 { print $1 }')
          if [ "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]; then
            echo "Remote release tag changed before publishing: remote=$REMOTE_TAG_SHA expected=$TARGET_SHA" >&2
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
