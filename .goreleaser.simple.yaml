version: 2
project_name: sub2api

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

archives: []
checksum:
  disable: true
changelog:
  disable: true
dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api:{{ .Version }}-amd64
      - ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api:{{ .Version }}
      - ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api:latest
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .Commit }}

docker_manifests: []
release:
  github:
    owner: '{{ .Env.GITHUB_REPO_OWNER }}'
    name: '{{ .Env.GITHUB_REPO_NAME }}'
  draft: false
  prerelease: auto
  name_template: Sub2API {{.Version}} (Simple)
  skip_upload: true
  header: |
    > AI API Gateway Platform - 将 AI 订阅配额分发和管理

    {{ .Env.TAG_MESSAGE }}
  footer: |
    ---

    Simple release: linux/amd64 GHCR image.
